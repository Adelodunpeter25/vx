name: Release

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o vx-linux-amd64 cmd/vx/*.go
          GOOS=linux GOARCH=arm64 go build -o vx-linux-arm64 cmd/vx/*.go
          GOOS=darwin GOARCH=amd64 go build -o vx-darwin-amd64 cmd/vx/*.go
          GOOS=darwin GOARCH=arm64 go build -o vx-darwin-arm64 cmd/vx/*.go

      - name: Delete existing v0.1.0 release and tag
        run: |
          gh release delete v0.1.0 --yes --repo ${{ github.repository }} 2>/dev/null || true
          git tag -d v0.1.0 2>/dev/null || true
          git push origin --delete refs/tags/v0.1.0 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.1.0
          name: v0.1.0
          files: |
            vx-linux-amd64
            vx-linux-arm64
            vx-darwin-amd64
            vx-darwin-arm64
          draft: false
          prerelease: false
